name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Disable git autocrlf
        run: git config --global core.autocrlf false
        if: matrix.os == 'windows-latest'

      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust
        run: rustup toolchain install nightly --no-self-update --profile minimal --component rust-src,rustfmt,clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --all-features --all-targets

      - name: Run clippy
        run: cargo clippy --all-features --all-targets -- --no-deps --deny warnings
      
  release-macos-x86_64-pkg:
    name: Build macOS x86_64 .pkg installer
    runs-on: macos-15-intel
    needs: check
    

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: macos-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust
        run: rustup toolchain install nightly --no-self-update --profile minimal --component rust-src

      - name: Build release binary
        run: cargo +nightly build --release --config .cargo/release.toml

      - name: Build macOS x86_64 pkg installer
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          PKG_NAME="edit-${GITHUB_REF_NAME}-macos-x86_64.pkg"

          mkdir -p pkgroot/usr/local/bin
          cp target/release/edit pkgroot/usr/local/bin/edit
          chmod 755 pkgroot/usr/local/bin/edit

          mkdir -p dist

          pkgbuild \
            --root pkgroot \
            --identifier com.microsoft.edit \
            --version "$VERSION" \
            --install-location / \
            "dist/$PKG_NAME"

          shasum -a 256 "dist/$PKG_NAME" > "dist/$PKG_NAME.sha256"

      - name: Upload pkg to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/edit-${{ github.ref_name }}-macos-x86_64.pkg
            dist/edit-${{ github.ref_name }}-macos-x86_64.pkg.sha256
