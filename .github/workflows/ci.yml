name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Disable git autocrlf
        run: git config --global core.autocrlf false
        if: matrix.os == 'windows-latest'

      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust
        run: rustup toolchain install nightly --no-self-update --profile minimal --component rust-src,rustfmt,clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --all-features --all-targets

      - name: Run clippy
        run: cargo clippy --all-features --all-targets -- --no-deps --deny warnings

  release-macos-x86_64:
    name: Build macOS x86_64 release binary
    runs-on: macos-15-intel
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: macos-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust
        run: rustup toolchain install nightly --no-self-update --profile minimal

      - name: Build release binary
        run: cargo +nightly build --release --config .cargo/release.toml

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/edit dist/edit

          cd dist
          chmod +x edit
          tar -czf edit-${{ github.ref_name }}-macos-x86_64.tar.gz edit

          shasum -a 256 edit-${{ github.ref_name }}-macos-x86_64.tar.gz > edit-${{ github.ref_name }}-macos-x86_64.tar.gz.sha256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/edit-${{ github.ref_name }}-macos-x86_64.tar.gz
            dist/edit-${{ github.ref_name }}-macos-x86_64.tar.gz.sha256
